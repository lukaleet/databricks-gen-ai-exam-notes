# Multi-step design scenarios. Each step is a decision; answers are letters.
scenarios:
  - id: s1
    title: HR Policy Assistant
    sections: [d1, d2, d4, d6]
    context: |
      A 20,000-employee company wants an internal assistant that answers HR policy questions
      (leave, benefits, travel). Sources: ~4,000 PDFs and DOCX files in a Unity Catalog volume,
      some scanned. Policies change monthly. Employees must get answers with citations.
      HR experts want to review answers before launch. Budget is moderate; latency under 3s is fine.
    steps:
      - q: The team wants the fastest path to a working, cited Q&A bot with minimal code. What do you recommend first?
        options:
          - Agent Bricks Information Extraction on the policies
          - A custom LangGraph RAG agent with a Vector Search index
          - Agent Bricks Knowledge Assistant on the UC volume
          - A Genie space over the policy volume
        answer: [C]
        explain: Knowledge Assistant builds a cited document Q&A agent from UC volume files with little or no code, and SMEs can improve it with feedback. A custom agent is more work, Genie is for tables, and Information Extraction outputs fields, not answers.
      - q: Later they move to a custom RAG agent for more control. Some PDFs are scanned images. How should they parse documents with the least custom code at scale?
        options:
          - ai_parse_document() over read_files(..., format => 'binaryFile')
          - read_files(..., format => 'text'), then ai_extract()
          - pypdf in a pandas UDF, skipping the scanned files
          - beautifulsoup4 over the files after converting them to HTML
        answer: [A]
        explain: ai_parse_document handles digital and scanned PDFs and Office files (with OCR) directly in SQL. pypdf can't read scans, and the text reader can't read binary documents.
      - q: Policies are well structured with section headings. Which chunking strategy?
        options:
          - Sentence-level chunks for maximum precision
          - Chunk by section headings, title as metadata
          - One chunk per document, so nothing is split
          - Fixed 256-token chunks with no overlap
        answer: [B]
        explain: Header-based chunking keeps each policy section together and adds context from the heading.
      - q: Policies update monthly; latency isn't critical; corpus is ~2M chunks. Which Vector Search configuration?
        options:
          - A new index built from scratch each month
          - TRIGGERED Delta Sync after the monthly ETL
          - Delta Sync with managed embeddings, CONTINUOUS sync
          - Direct Vector Access, with upserts after the monthly ETL
        answer: [B]
        explain: Monthly updates call for triggered sync, which is cheapest. Managed embeddings minimize code. At 2M vectors either endpoint type works, so pick based on latency and cost.
      - q: Before launch, HR experts must test the bot and give feedback that becomes a regression test set. Which TWO?
        options:
          - Skip pre-launch review and rely on production monitoring
          - Fine-tune the LLM every week on the SME comments
          - Have SMEs rate answers in a spreadsheet that the team reads before launch
          - Turn SME corrections into an evaluation dataset for mlflow.genai.evaluate()
          - Deploy with agents.deploy() and collect feedback in the Review App
        answer: [D, E]
        explain: The Review App collects structured SME feedback. Turning it into expectations gives repeatable evaluation with ground-truth judges such as Correctness.

  - id: s2
    title: E-commerce Product Search
    sections: [d2, d4]
    context: |
      An online retailer wants semantic product search with metadata filters (category, price, in-stock).
      Catalog: 150 million products. Peak 120 queries/second. p95 latency must stay under 150 ms.
      Product data changes every few minutes (stock, price). The team will invest engineering effort
      to improve relevance as long as latency is not harmed.
    steps:
      - q: Which endpoint type?
        options:
          - Standard for reads, storage-optimized for writes
          - Storage-optimized with reranking off
          - Standard
          - Storage-optimized
        answer: [C]
        explain: The 150 ms budget rules out storage-optimized (higher latency). Standard endpoints handle this scale at high QPS.
      - q: Which sync mode for near-real-time stock and price changes?
        options:
          - Triggered, after each nightly ETL
          - Triggered, every hour
          - Direct Vector Access with weekly upserts
          - Continuous
        answer: [D]
        explain: Continuous sync keeps the index fresh within seconds and is available on standard endpoints. Hourly or nightly triggers leave stock and prices stale.
      - q: How to improve relevance without adding query latency?
        options:
          - Raise num_results to 200 and let the app re-sort by popularity
          - Enable hybrid search so product names match exactly
          - Turn on reranking over the top 50 results for every query
          - Fine-tune the embedding model; no hybrid or reranking
        answer: [D]
        explain: Reranking and hybrid search add query latency. Fine-tuning the embedding model puts the cost up front and leaves query latency unchanged.
      - q: Users filter by in-stock items under $50 in "shoes". How?
        options:
          - Retrieve the top 500 results and filter them in the application
          - Create a separate index per category with stock and price columns
          - Metadata filters in the similarity search (category, price, in_stock)
          - Add "in stock under $50 shoes" to the query text before embedding
        answer: [C]
        explain: Metadata filters apply hard constraints deterministically during search. Post-filtering can return too few results, and embeddings don't enforce numeric limits.

  - id: s3
    title: Sales + Policy Multi-Agent Assistant
    sections: [d1, d3, d4]
    context: |
      Sales managers want one chat assistant that can (1) answer numeric questions about pipeline and
      revenue from governed UC tables, (2) answer questions about discount policies from PDFs, and
      (3) create a CRM follow-up task via an internal REST API. Users have different row-level access
      to sales data by region.
    steps:
      - q: Which component should answer "What was Q3 revenue in EMEA by product line?"
        options:
          - A Knowledge Assistant over sales reports
          - A Genie space over the sales tables
          - A UC function that returns all sales rows
          - A Vector Search index over the table rows
        answer: [B]
        explain: Aggregations over structured tables are a text-to-SQL job, which is what Genie does.
      - q: How do you combine the Genie space, a policy Knowledge Assistant and the CRM action behind one interface with minimal code?
        options:
          - A Genie space with the policies loaded as a table
          - A Knowledge Assistant that also indexes the sales tables
          - Multi-Agent Supervisor (Agent Bricks) over the three
          - Three Databricks Apps behind a shared landing page
        answer: [C]
        explain: The Supervisor routes each request to the right sub-agent or tool with minimal code.
      - q: The CRM API has no MCP server. How should the agent call it via MCP?
        options:
          - Build a custom MCP server and host it as a Databricks App
          - Use the managed UC functions MCP server, pointing at the API URL
          - Register the API as an external MCP server via a UC connection
          - Call the REST API from the system prompt with the key inline
        answer: [A]
        explain: Proprietary APIs with no existing server call for a custom MCP server, and Databricks Apps can host it. An external server needs one that already exists.
      - q: Managers must only see revenue for their own regions (UC row filters). Which auth model for data access?
        options:
          - On-behalf-of-user, so queries run as the user and row filters apply
          - A shared service principal, filtering rows in the agent's code
          - Automatic passthrough, with the sales tables declared as resources
          - A service principal per region, chosen from the user's profile
        answer: [A]
        explain: OBO enforces per-user UC permissions, row filters and column masks. Passthrough and service principals run every query with the same identity.
      - q: The CRM "create task" tool has side effects. Which guardrail?
        options:
          - An output guardrail that blocks responses mentioning CRM tasks
          - An instruction to create tasks only when the user clearly asks
          - Logging every task creation to the inference table for review
          - Confirm with the user first, and give the tool least privilege
        answer: [D]
        explain: Action-taking tools need confirmation and least privilege. Prompt rules can be bypassed, and logs only help afterwards.

  - id: s4
    title: Invoice Processing at Scale
    sections: [d1, d2, d4, d5]
    context: |
      Finance receives 300,000 vendor invoices per month (PDF and scanned PNG). They need vendor,
      invoice number, due date, line totals and currency in a Delta table every night. No chat UI
      is needed. Invoices contain bank account numbers which must not be stored in clear text.
    steps:
      - q: Is this a real-time or batch workload?
        options:
          - Batch
          - Streaming with a chat agent
          - Interactive, via a Genie space
          - Real-time serving
        answer: [A]
        explain: Nightly processing with no user waiting is batch.
      - q: Which Databricks approach extracts the fields with the least custom code?
        options:
          - Information Extraction (or ai_parse_document + ai_extract in a job)
          - A Genie space over the invoice volume with extraction instructions
          - A real-time agent endpoint called per invoice from a Python loop
          - Knowledge Assistant over the invoice volume, queried each night
        answer: [A]
        explain: Unstructured to structured extraction against a schema is exactly what Information Extraction and ai_extract do.
      - q: How should bank account numbers be handled?
        options:
          - Encrypt the whole Delta table, leaving the column in clear text inside
          - Pass them to the LLM with an instruction not to repeat them
          - Mask or tokenize them during processing
          - Store them in clear text in a table that only finance can read
        answer: [C]
        explain: Mask early and govern access to whatever you keep. Table encryption or access controls still leave the values readable to anyone with access.
      - q: Some rows fail extraction due to unreadable scans. How do you keep the job running?
        options:
          - failOnError => false, routing failed rows to a review table
          - Lower the temperature so the model stops failing on scans
          - Switch to a provisioned throughput endpoint for the job
          - Retry the whole job until every invoice parses successfully
        answer: [A]
        explain: Per-row error handling keeps the batch running so failures can be handled separately.

  - id: s5
    title: Customer Support Chatbot Launch & Monitoring
    sections: [d3, d5, d6]
    context: |
      A public-facing support chatbot (RAG + order-lookup tool) is deployed with Agent Framework.
      Leadership wants: no toxic output, no PII leaks, cost control, visibility into quality on
      live traffic, and a way to catch regressions before each release.
    steps:
      - q: Which configuration blocks toxic content and masks PII on requests and responses with no code?
        options:
          - AI Gateway guardrails (safety + PII) on the endpoint
          - A system prompt rule against toxic or personal content
          - Llama Guard called from the agent's own code
          - UC column masks on the endpoint's inference table
        answer: [A]
        explain: Gateway guardrails are configuration-only safety and PII controls on requests and responses. Llama Guard in code works but isn't configuration-only.
      - q: Which TWO help control cost?
        options:
          - Per-user rate limits in AI Gateway
          - Scale-to-zero turned off on idle development endpoints
          - The largest available LLM for the intent-classification step
          - Token usage tracking in system.serving.endpoint_usage
          - The most expensive judge running on 100% of live traffic
        answer: [A, D]
        explain: Rate limits cap usage, and usage tables show where the tokens go.
      - q: How do you continuously measure answer quality on live traffic without ground truth?
        options:
          - Run mlflow.genai.evaluate() on the launch dataset every week
          - Registered Safety, relevance and groundedness judges, sampled
          - Run Correctness on a 10% sample of live traffic every night
          - Track the thumbs-down rate alone, since judges are expensive
        answer: [B]
        explain: Production monitoring needs judges that don't use ground truth, applied with sampling. Correctness needs expected answers, which live traffic doesn't have.
      - q: How do you prevent quality regressions in the next release?
        options:
          - Deploy with 10% traffic splitting and roll back if complaints rise
          - 'A CI gate: evaluate() on a fixed set incl. production failures'
          - Unit-test the tools and parsers, and skip end-to-end evaluation
          - Evaluate each release on newly generated synthetic questions only
        answer: [B]
        explain: An evaluation dataset that grows from production failures is your regression test suite, and running it in CI catches regressions before users see them.

  - id: s6
    title: Prompt & Model Promotion Pipeline
    sections: [d4]
    context: |
      A team runs dev, staging and prod workspaces. They change prompts weekly and agent code monthly.
      Requirements: gated promotion, full version history, instant rollback, reproducible deployments.
    steps:
      - q: Where should prompts live?
        options:
          - Model Serving environment variables per workspace
          - A Delta table of prompts with an is_production flag
          - Prompt Registry in Unity Catalog, promoted via aliases
          - A prompts folder in Git, deployed with the agent's code
        answer: [C]
        explain: Immutable versions plus movable aliases give gated promotion and rollback.
      - q: How should the agent reference the prompt so promotion needs no redeploy?
        options:
          - load_prompt("prompts:/catalog.schema.name@production") at runtime
          - load_prompt("prompts:/catalog.schema.name/3") at runtime
          - load_prompt("prompts:/catalog.schema.name@production") at build time
          - The prompt text copied into agent.py during the CI build
        answer: [A]
        explain: An alias reference resolved at runtime picks up whatever version the alias points to. Resolving it at build time or pinning a version needs a redeploy.
      - q: How should infrastructure (endpoints, jobs, apps) be deployed per environment?
        options:
          - Jobs exported as JSON and re-imported per workspace
          - A driver notebook that recreates resources on demand
          - Asset Bundles with dev/staging/prod targets, run from CI
          - Git folders synced into each workspace by hand
        answer: [C]
        explain: Bundles (also called Declarative Automation Bundles) make deployments declarative and reproducible across targets.
      - q: Model promotion to prod should be reversible instantly. How?
        options:
          - Model stages, moving versions from Staging to Production
          - A new model name per release, switched in the endpoint
          - A tag env=prod on the current version, read at deploy time
          - UC model aliases (@champion), serving the alias's version
        answer: [D]
        explain: Aliases replace stages in Unity Catalog, and moving an alias is an instant rollback.

  - id: s7
    title: Research Assistant with MCP Tools
    sections: [d4]
    context: |
      A research assistant agent needs: (1) governed UC functions for internal calculations,
      (2) a third-party web-search vendor that offers an MCP server and requires an API key,
      (3) internal documents in a Vector Search index. Maintenance overhead must be minimal.
    steps:
      - q: How should the agent access UC functions and the Vector Search index?
        options:
          - LangChain tools that call the REST APIs
          - Databricks managed MCP servers
          - A custom MCP server on Databricks Apps
          - An external MCP server via a UC connection
        answer: [B]
        explain: Managed servers need no maintenance and are UC-governed.
      - q: How should the web-search vendor be integrated?
        options:
          - A managed MCP server, with the API key passed as a tool argument
          - External MCP server via a UC connection, key in secrets
          - Direct REST calls from the agent, with the key in an env var
          - A custom MCP server on Databricks Apps wrapping the vendor API
        answer: [B]
        explain: External MCP servers plus secrets is the least-maintenance, secure option.
      - q: Which statement is a red flag for this design?
        options:
          - Storing the vendor credentials in a UC connection
          - Declaring the index and functions as resources for auth
          - Using Unity Catalog permissions to govern access to each tool
          - One new custom MCP server wrapping all three sources
        answer: [D]
        explain: A custom wrapper adds maintenance when managed and external servers already exist.
