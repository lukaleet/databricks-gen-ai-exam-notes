section: d3
questions:
  - id: d3-01
    objective: Select Langchain/similar tools for use in a Generative AI application
    q: A team needs a stateful agent with loops, conditional branching between tool calls, and persisted conversation checkpoints. Which framework fits best?
    options:
      - A LlamaIndex query engine
      - A LangChain LCEL chain
      - A plain MLflow pyfunc
      - LangGraph
    answer: [D]
    explain: LangGraph models agents as graphs with state, cycles, conditional edges and checkpointers. A linear LCEL chain, a query engine or a single predict call doesn't loop or persist state.

  - id: d3-02
    objective: Select Langchain/similar tools for use in a Generative AI application
    q: Which package provides ChatDatabricks, DatabricksEmbeddings and VectorSearchRetrieverTool for LangChain-based applications on Databricks?
    options:
      - databricks-sdk
      - databricks-vectorsearch
      - langchain-community
      - databricks-langchain
    answer: [D]
    explain: databricks-langchain is the official integration package for LangChain on Databricks. databricks-sdk and databricks-vectorsearch are lower-level clients without LangChain classes.

  - id: d3-03
    objective: Select Langchain/similar tools for use in a Generative AI application
    q: An engineer built an agent with the OpenAI Agents SDK and wants to deploy it with Mosaic AI Agent Framework, with tracing, evaluation and the Review App. What should they do?
    options:
      - Wrap it in the MLflow ResponsesAgent interface and log it with MLflow
      - Deploy it as a Databricks App and call the app from the Review App
      - Rewrite its tools as Unity Catalog functions and drop the SDK
      - Rewrite it in LangGraph, the framework that Agent Framework requires
    answer: [A]
    explain: ResponsesAgent is framework-agnostic. You can wrap any agent (OpenAI Agents SDK, LangGraph, custom) and deploy it with Agent Framework, which adds tracing, evaluation and the Review App.

  - id: d3-04
    objective: Select Langchain/similar tools for use in a Generative AI application
    q: A team has an app written with the OpenAI Python client and wants to switch it to a Databricks Foundation Model API endpoint with minimal code changes. What should they do?
    options:
      - Wrap the endpoint in a LangChain chain, because FMAPI isn't OpenAI-compatible
      - Rewrite the calls with ai_query() through the Databricks SQL connector
      - Install the Databricks proprietary chat SDK, since the OpenAI client can't authenticate
      - Use get_open_ai_client() and change only the model name in calls
    answer: [D]
    explain: Foundation Model APIs expose OpenAI-compatible chat, completions and embeddings APIs, so the OpenAI client works once it points at the workspace with Databricks credentials.

  - id: d3-05
    objective: Qualitatively assess responses to identify common issues such as quality and safety
    q: A RAG bot answers "Our return window is 60 days," but the only retrieved policy chunk says 30 days. What issue is this?
    options:
      - Prompt injection inside the chunk
      - Hallucination (an ungrounded response)
      - A stale index (an outdated chunk)
      - Retrieval failure (an irrelevant chunk)
    answer: [B]
    explain: The response contradicts the retrieved context, so it's ungrounded. The chunk itself was relevant and correct. RetrievalGroundedness detects this.

  - id: d3-06
    objective: Qualitatively assess responses to identify common issues such as quality and safety
    q: Reviewing traces, an engineer sees that the retrieved chunks are relevant and contain the answer, but the response ignores half of the user's two-part question. What is the most direct fix?
    options:
      - Add a reranker so the most relevant chunk is placed first in the prompt
      - Instruct the prompt to address every part of the question, then re-evaluate
      - Raise num_results so both parts of the question get more supporting context
      - Re-chunk with smaller chunks so each part of the question has its own chunk
    answer: [B]
    explain: Retrieval is fine, so the problem is in generation. Adjust the prompt and confirm the fix with evaluation. Changing retrieval doesn't help when the right context is already there.

  - id: d3-07
    objective: Qualitatively assess responses to identify common issues such as quality and safety
    q: Which Databricks tools help an engineer qualitatively inspect and compare LLM responses during development? Select TWO.
    options:
      - System billing tables, broken down per endpoint
      - Unity Catalog lineage of the index's source tables
      - Lakehouse Monitoring drift metrics on the chunks table
      - AI Playground, for side-by-side model comparison
      - MLflow trace UI, for each step's inputs and outputs
    answer: [D, E]
    explain: AI Playground compares models and prompts interactively. MLflow traces show each step (retrieval, tool calls, LLM) for debugging.

  - id: d3-08
    objective: Select chunking strategy based on model & retrieval evaluation
    q: An engineer is unsure whether 256-, 512- or 1024-token chunks are best. What is the recommended approach?
    options:
      - Evaluate each option on the same eval set and judges
      - Pick 512 tokens, the most common default for embedding models
      - Use the largest size that still fits the LLM's context window
      - Choose the size that produces the fewest chunks, to cut cost
    answer: [A]
    explain: Chunking should be data-driven. Compare strategies on the same evaluation set using retrieval and answer quality metrics, and weigh cost and latency.

  - id: d3-09
    objective: Select chunking strategy based on model & retrieval evaluation
    q: Evaluation shows high RetrievalRelevance but low RetrievalSufficiency for 1024-token chunks with a 512-token embedding model. What is the likely cause?
    options:
      - The judge model can't read 1024-token chunks in one pass
      - Each chunk's tail is beyond the embedding window
      - The LLM temperature is too high for complete answers
      - The reranker favours short chunks over long ones
    answer: [B]
    explain: When chunks are longer than the embedding window, content past the window is truncated in the embedding. Retrieved chunks look relevant, but the facts that matter may be in the part that was never matched. Make the chunk size fit the model.

  - id: d3-10
    objective: Augment a prompt with additional context from a user's input based on key fields, terms, and intents
    q: 'A user writes: "What is the warranty on order 88213?" Which augmentation produces the best-grounded answer?'
    options:
      - Embed the whole question as-is and retrieve the closest warranty chunks for it
      - Add every warranty policy for every product line to the prompt as context
      - Extract order_id, look up the order, retrieve that product's warranty
      - Rewrite it into a generic warranty question first, then retrieve policy chunks
    answer: [C]
    explain: Extracting key fields lets you fetch exactly the structured facts and policy context needed, so the prompt stays precise and grounded. Embedding the raw question can't resolve which product order 88213 is.

  - id: d3-11
    objective: Augment a prompt with additional context from a user's input based on key fields, terms, and intents
    q: Users of an internal bot use many acronyms (e.g. "PTO", "ESPP") that don't appear in documents, which use full terms. What improves retrieval?
    options:
      - Expand or rewrite queries, mapping acronyms to full terms
      - Fine-tune the LLM so that it understands company acronyms
      - Re-chunk the documents into smaller, more precise chunks
      - Raise num_results so more chunks match the acronyms
    answer: [A]
    explain: Rewriting or expanding the query bridges the vocabulary gap between users and documents. Fine-tuning the LLM doesn't change what the retriever finds.

  - id: d3-12
    objective: Augment a prompt with additional context from a user's input based on key fields, terms, and intents
    q: A support assistant serves billing, shipping and technical questions, each needing different instructions and data. What is the best design?
    options:
      - Classify intent, then route to a specific prompt and tools
      - Fine-tune one model on examples from all three domains
      - One prompt with all instructions and tools, ordered by priority
      - Three separate apps, with users choosing the right one themselves
    answer: [A]
    explain: Intent detection plus routing keeps each prompt focused and adds only the relevant context and tools.

  - id: d3-13
    objective: Create a prompt that adjusts an LLM's response from a baseline to a desired output
    q: Baseline responses are accurate but long and technical. The desired output is a 3-bullet summary for non-technical customers. Which prompt change is most effective?
    options:
      - '"You are a friendly support agent," with no other change'
      - '"3 short bullets, no jargon, for a non-technical customer" + an example'
      - '"Be concise," with the temperature lowered to 0'
      - '"Simplify your answer," with max_tokens capped at 100'
    answer: [B]
    explain: Explicit audience, length and format instructions plus a few-shot example move the output from the baseline to the target. Vague instructions or token caps truncate rather than reshape.

  - id: d3-14
    objective: Create a prompt that adjusts an LLM's response from a baseline to a desired output
    q: After several prompt edits, the team can't tell which version produced better results. What should they do?
    options:
      - Ask an LLM judge to compare the prompt texts and pick the clearer one
      - Version them in the Prompt Registry; evaluate each on one dataset
      - A/B test every version in production and keep the one with more thumbs-ups
      - Keep the prompts in Git and use whichever one the team prefers in demos
    answer: [B]
    explain: Versioned prompts plus consistent evaluation on the same dataset make comparisons objective and traceable.

  - id: d3-15
    objective: Create a prompt that adjusts an LLM's response from a baseline to a desired output
    q: Prompting alone cannot get a model to consistently use a company's very specific writing style and domain terminology across thousands of examples. Facts do not change often. What is a reasonable next step?
    options:
      - Add the full company style guide to the system prompt
      - Fine-tune the model on high-quality examples of the style
      - Switch to a larger base model with the same prompt
      - Raise the temperature so the model varies its wording
    answer: [B]
    explain: Fine-tuning suits consistent style, format and domain language when prompting falls short. It's not a good fit for frequently changing facts, which belong in RAG.

  - id: d3-16
    objective: Implement LLM guardrails to prevent negative outcomes
    q: A public chatbot must not return toxic content and must not leak credit card numbers. Which Databricks feature provides both controls at the serving endpoint level with configuration only?
    options:
      - AI Gateway rate limits plus a weekly inference table review
      - AI Gateway guardrails (safety filtering, PII block/mask)
      - Llama Guard called from the agent's own Python code
      - Unity Catalog column masks on the endpoint's inference table
    answer: [B]
    explain: AI Gateway guardrails (now part of Unity Gateway service policies) offer safety filtering and PII detection on requests and responses with configuration only. Llama Guard in code works but isn't configuration-only.

  - id: d3-17
    objective: Implement LLM guardrails to prevent negative outcomes
    q: Which TWO are INPUT guardrails?
    options:
      - Validating the model's output against the expected JSON schema
      - Checking the response for toxic language
      - Detecting prompt injection before calling the LLM
      - Redacting PII from the model's answer
      - Masking PII in the user message before the model
    answer: [C, E]
    explain: Input guardrails act on the request. Toxicity checks on the response and JSON validation are output guardrails.

  - id: d3-18
    objective: Implement LLM guardrails to prevent negative outcomes
    q: An agent can call a "delete_customer_record" tool. What is the most important guardrail?
    options:
      - An output guardrail that blocks responses mentioning deletion
      - Human confirmation plus least-privilege permissions for the tool
      - A system prompt rule to delete only records the user owns
      - Logging every call to that tool in an inference table for audit
    answer: [B]
    explain: Destructive actions need human-in-the-loop confirmation and tight permissions. Prompt rules can be bypassed, and logging only tells you after the damage.

  - id: d3-19
    objective: Select the best LLM based on the attributes of the application to be developed
    q: An application must classify short support messages into 6 categories at very high volume with low latency and cost. Which model choice is most appropriate?
    options:
      - The smallest model that meets the accuracy target
      - A long-context model that explains the reason for each label
      - A 70B general model with few-shot examples of each category
      - The largest reasoning model, to maximize classification accuracy
    answer: [A]
    explain: For simple, high-volume tasks, choose the smallest model that meets the quality bar, which keeps latency and cost low.

  - id: d3-20
    objective: Select the best LLM based on the attributes of the application to be developed
    q: An app sends long prompts of 40k tokens (retrieved context plus history). Which model attribute is a hard requirement?
    options:
      - Function calling, to fetch the context in smaller pieces
      - A context window that fits the prompt plus the output
      - A mixture-of-experts architecture for long inputs
      - The top MMLU score among the candidate models
    answer: [B]
    explain: If the prompt and output don't fit the context window, the request fails or gets truncated. Context length is a hard constraint. Benchmarks and architecture are secondary.

  - id: d3-21
    objective: Select the best LLM based on the attributes of the application to be developed
    q: An agent must reliably call external tools with structured arguments. Which model capability is essential?
    options:
      - A very large context window
      - Low-latency token streaming
      - Vision (image) input support
      - Function (tool) calling support
    answer: [D]
    explain: Agents depend on the model's ability to emit structured tool calls. The other capabilities are nice to have.

  - id: d3-22
    objective: Select an embedding model context length based on source documents, expected queries, and optimization strategy
    q: Documents are chunked to at most 256 tokens, and queries are short. Cost and latency matter more than marginal quality. Which embedding model profile is best?
    options:
      - Context 32768, 14 GB, 4096 dimensions
      - Context 128, 0.05 GB, 256 dimensions
      - Context 8192, 7 GB, 4096 dimensions
      - Context 512, 0.1 GB, 384 dimensions
    answer: [D]
    explain: The model must fit 256-token chunks, and the smallest model that does is cheapest and fastest. A 128-token model would truncate chunks.

  - id: d3-23
    objective: Select an embedding model context length based on source documents, expected queries, and optimization strategy
    q: After switching the query embedding model to a newer one with the same dimension, retrieval quality collapses, although the index hasn't changed. What is the cause?
    options:
      - The index caches results computed with the old query model
      - The HNSW graph must be rebuilt after any change to the query side
      - The newer model needs a larger num_results to find the same chunks
      - Query and document vectors now come from different models' spaces
    answer: [D]
    explain: Vectors from different models live in different spaces, even with the same dimension, so query and document embeddings must come from the same model. Re-embed the documents or keep the old query model.

  - id: d3-24
    objective: Select a model from a model hub or marketplace for a task based on model metadata/model cards
    q: A commercial product needs an open-weight LLM. Model X has the best benchmark score but its model card states a research-only, non-commercial license. What should the engineer do?
    options:
      - Fine-tune Model X, because the derived weights count as a new model
      - Use Model X, since open-weight models can be downloaded freely
      - Choose the best-performing model whose license allows commercial use
      - Use Model X only to generate the product's training data
    answer: [C]
    explain: The license on the model card is a hard constraint. Benchmarks don't override legal terms, and fine-tuning or indirect use doesn't remove the restriction.

  - id: d3-25
    objective: Select a model from a model hub or marketplace for a task based on model metadata/model cards
    q: Which information is typically found on a model card and is most useful when selecting a model? Select TWO.
    options:
      - License and context length
      - Benchmark scores on your own private data
      - The token price in your Databricks contract
      - Intended tasks and limitations
      - The endpoint's p95 latency in your workspace
    answer: [A, D]
    explain: Model cards describe intended use, limitations, license, size, context length, training data and evaluation results.

  - id: d3-26
    objective: Select the best model for a given task based on common metrics generated in experiments
    q: Which metric is most commonly used to compare models on a summarization task against reference summaries?
    options:
      - BLEU
      - ROUGE
      - Perplexity
      - Exact match
    answer: [B]
    explain: ROUGE measures n-gram overlap (recall-oriented) with reference summaries. BLEU is mainly used for translation.

  - id: d3-27
    objective: Select the best model for a given task based on common metrics generated in experiments
    q: Which metric is classically used for machine translation quality against reference translations?
    options:
      - ROUGE-L
      - Exact match
      - BLEU
      - Perplexity
    answer: [C]
    explain: BLEU measures n-gram precision against reference translations.

  - id: d3-28
    objective: Select the best model for a given task based on common metrics generated in experiments
    q: 'Three models were evaluated: A (correctness 0.91, p95 latency 4.8s), B (0.89, 1.1s), C (0.74, 0.4s). The requirement is correctness ≥ 0.85 and the lowest possible latency. Which model?'
    options:
      - B
      - None meet the requirement
      - A
      - C
    answer: [A]
    explain: Only A and B meet the quality threshold. Of those, B has much lower latency.

  - id: d3-29
    objective: Utilize MLflow and Agent Framework for developing agentic systems
    q: An engineer is starting a new agent with Agent Framework and wants the interface Databricks recommends, compatible with the OpenAI Responses schema, streaming and tool calls. Which should they implement?
    options:
      - mlflow.pyfunc.PythonModel
      - MLflow ChatAgent
      - MLflow ResponsesAgent
      - MLflow ChatModel
    answer: [C]
    explain: ResponsesAgent is the recommended interface (OpenAI Responses-compatible). ChatAgent and ChatModel are legacy, and a plain PythonModel lacks the agent schema.

  - id: d3-30
    objective: Utilize MLflow and Agent Framework for developing agentic systems
    q: Logging an agent fails because a client object inside it can't be pickled. Which MLflow approach avoids serializing the agent object?
    options:
      - Pass the client's module in code_paths so the object can be pickled
      - Save the agent with joblib and log the file as an artifact
      - 'Models from code: log agent.py, which calls mlflow.models.set_model()'
      - Log it with cloudpickle and pin the client library's version
    answer: [C]
    explain: Models from code logs the source file (python_model="agent.py"), which avoids serialization problems and keeps code readable. code_paths only ships dependencies.

  - id: d3-31
    objective: Utilize MLflow and Agent Framework for developing agentic systems
    q: Besides creating a Model Serving endpoint, what else does databricks.agents.deploy() set up? Select TWO.
    options:
      - A Vector Search index for the agent's documents
      - A new registered model version in Unity Catalog
      - A Databricks App that hosts a chat UI
      - Inference tables / tracing for monitoring
      - A Review App for stakeholder feedback
    answer: [D, E]
    explain: agents.deploy() creates the endpoint, enables the Review App, and sets up logging, tracing and monitoring through inference tables.

  - id: d3-32
    objective: Utilize MLflow and Agent Framework for developing agentic systems
    q: How can an engineer capture every LLM call, retrieval and tool call made by a LangChain-based agent with minimal code?
    options:
      - mlflow.log_artifact()
      - Cluster log delivery
      - mlflow.langchain.autolog()
      - mlflow.langchain.log_model()
    answer: [C]
    explain: Framework autologging turns on MLflow Tracing, which records spans for each step. log_model and log_artifact save artifacts, not traces.

  - id: d3-33
    objective: Compare the evaluation and monitoring phases of the Gen AI application life cycle
    q: Which statement correctly contrasts evaluation and monitoring?
    options:
      - Evaluation uses LLM judges. Monitoring uses only latency and error-rate metrics
      - 'Evaluation: offline, curated, ground truth possible. Monitoring: live, usually unlabeled'
      - Evaluation runs after deployment. Monitoring runs before release, on test data
      - Both score live traffic. Monitoring simply samples a smaller share of requests
    answer: [B]
    explain: Evaluation is pre-production on curated data (ground truth possible). Monitoring is production on live traces, usually with judges that don't need ground truth. Both can use LLM judges.

  - id: d3-34
    objective: Compare the evaluation and monitoring phases of the Gen AI application life cycle
    q: Which judge is NOT suitable for automated production monitoring of live traffic without labels?
    options:
      - RetrievalGroundedness
      - Correctness
      - Safety
      - RelevanceToQuery
    answer: [B]
    explain: Correctness needs expected answers (ground truth), which live traffic doesn't have.

  - id: d3-35
    objective: Compare the evaluation and monitoring phases of the Gen AI application life cycle
    q: How do monitoring and evaluation feed each other in a mature GenAI lifecycle?
    options:
      - Evaluation results set the sample rate of the monitoring judges
      - Monitoring scores replace the eval dataset once traffic is high enough
      - Monitoring traces fine-tune the LLM automatically every week
      - Problem production traces are labeled and added to the eval dataset
    answer: [D]
    explain: Monitoring finds failures. Those cases, once labeled by SMEs, grow the evaluation set and become regression tests.

  - id: d3-36
    objective: Enable multi-agent systems to leverage Genie Spaces or conversational API to retrieve data
    q: A multi-agent assistant must answer "What were last month's top 10 products by revenue?" from governed sales tables. Which sub-agent is most appropriate?
    options:
      - An Information Extraction agent over invoices
      - A Vector Search retriever over the table rows
      - A Knowledge Assistant over sales reports
      - A Genie space over the sales tables
    answer: [D]
    explain: Aggregations over structured tables are a text-to-SQL job, and Genie spaces are built for it. Vector search over rows can't compute a top-10 by revenue.

  - id: d3-37
    objective: Enable multi-agent systems to leverage Genie Spaces or conversational API to retrieve data
    q: A Slack bot built outside Databricks needs to ask natural-language questions of a Genie space and get results, including follow-up questions. What should it use?
    options:
      - The SQL Statement Execution API against the space's warehouse
      - The Vector Search query API over the space's tables
      - The Genie Conversation API, with follow-up messages
      - The Model Serving query API with the space ID as the endpoint
    answer: [C]
    explain: The Genie Conversation API lets external apps start conversations, send follow-ups and fetch query results. The Statement Execution API needs SQL, not natural language.

  - id: d3-38
    objective: Enable multi-agent systems to leverage Genie Spaces or conversational API to retrieve data
    q: An agent that uses a Genie space is deployed to Model Serving with automatic authentication passthrough. Which resource must be declared when logging the agent?
    options:
      - DatabricksTable for each table, without declaring the space
      - DatabricksSQLWarehouse only, since Genie runs its queries on it
      - DatabricksServingEndpoint pointing at the Genie space
      - DatabricksGenieSpace (plus its SQL warehouse and tables as needed)
    answer: [D]
    explain: Declare DatabricksGenieSpace(genie_space_id=...) so Databricks can provision short-lived credentials. Genie also needs access to its warehouse and tables.

  - id: d3-39
    objective: Enable multi-agent systems to leverage Genie Spaces or conversational API to retrieve data
    q: Which TWO options let a LangGraph-based multi-agent system use a Genie space as a sub-agent or tool?
    options:
      - A VectorSearchRetrieverTool over the space's tables
      - The SQL Statement Execution API called with the space ID
      - The space's exported instructions pasted into the system prompt
      - The managed MCP server for Genie (/api/2.0/mcp/genie/{space_id})
      - GenieAgent from databricks_langchain.genie
    answer: [D, E]
    explain: GenieAgent wraps a Genie space for LangChain/LangGraph, and the managed Genie MCP server exposes it as an MCP tool.

  - id: d3-40
    objective: Select a model from a model hub or marketplace for a task based on model metadata/model cards
    q: A team is browsing a model hub for an open model to classify Japanese support tickets in a commercial product. Which model-card details should drive the shortlist?
    options:
      - Supported languages, intended tasks and license
      - Parameter count and the hardware used for training
      - Release date and the authors' affiliation
      - Download count and number of community likes
    answer: [A]
    explain: The model must handle Japanese, fit the classification task, and allow commercial use. Popularity, training hardware and release date don't tell you whether it fits.

  - id: d3-41
    objective: Select an embedding model context length based on source documents, expected queries, and optimization strategy
    q: Queries are short, but the documents are 6,000-token legal opinions whose meaning depends on whole sections. The team keeps chunks at ~2,000 tokens to preserve the argument flow. Which embedding requirement follows?
    options:
      - An embedding dimension of at least 2,000
      - A multilingual model, since legal text is specialized
      - A context length of at least ~2,000 tokens (e.g. 8k)
      - A 512-token context, matched to the short queries
    answer: [C]
    explain: The embedding model must cover the full chunk, so its context length must exceed the chunk size. Dimension is unrelated to input length, and the query length doesn't set the limit.

  - id: d3-42
    objective: Select chunking strategy based on model & retrieval evaluation
    q: 'Two chunking strategies were evaluated on the same 200-question set. A (512 tokens): RetrievalSufficiency 0.82, cost per 1k queries $1.00. B (1,024 tokens): 0.84, $1.60, and 30% higher p95 latency. The requirement is sufficiency ≥ 0.80 at minimal cost. Which should they choose?'
    options:
      - Both, routed by query length
      - Neither; test more chunk sizes first
      - B
      - A
    answer: [D]
    explain: Both meet the threshold, and A does it at lower cost and latency. The small quality gain of B isn't required.
