section: d4
questions:
  - id: d4-01
    objective: Code a chain using a pyfunc model with pre- and post-processing
    q: In a custom mlflow.pyfunc.PythonModel, where should an expensive client (e.g. a connection to a serving endpoint) be initialized so it is created only once when the model loads?
    options:
      - The model signature's params
      - predict(), on every request
      - __init__(), when the model is logged
      - load_context(self, context)
    answer: [D]
    explain: load_context runs once when the model loads on the server. predict runs on every request, and __init__ runs at logging time, not at serving time.

  - id: d4-02
    objective: Code a chain using a pyfunc model with pre- and post-processing
    q: A pyfunc chain must strip HTML from user input before calling the LLM and must mask phone numbers in the LLM response. Where should these steps go?
    options:
      - Both in load_context(), since they are fixed rules for every request
      - 'In predict(): pre-process before the LLM call, post-process after it'
      - Pre-processing in load_context(), post-processing in predict()
      - In the signature and input_example, which validate inputs and outputs
    answer: [B]
    explain: Pre- and post-processing are per-request logic in predict (often as helper methods called from predict). load_context only runs once at load time.

  - id: d4-03
    objective: Code a chain using a pyfunc model with pre- and post-processing
    q: Why would an engineer choose mlflow.pyfunc over a framework-specific flavor such as mlflow.langchain?
    options:
      - Because only pyfunc models can be registered in Unity Catalog
      - To wrap custom Python logic in a standard predict()
      - Because framework flavors can't be served on Model Serving
      - Because pyfunc models get automatic tracing of every step
    answer: [B]
    explain: pyfunc is the generic flavor for custom logic. Framework flavors can also be registered and served, and every MLflow model can be loaded as pyfunc.

  - id: d4-04
    objective: Code a simple chain according to requirements
    q: In LangChain Expression Language (LCEL), which chain correctly formats a prompt, calls a chat model and returns a plain string?
    options:
      - llm | prompt | StrOutputParser()
      - prompt + llm + StrOutputParser()
      - prompt | llm | StrOutputParser()
      - prompt | StrOutputParser() | llm
    answer: [C]
    explain: 'LCEL pipes components left to right with |: prompt → model → parser.'

  - id: d4-05
    objective: Code a simple chain according to requirements
    q: 'A simple RAG chain is required: take a question, retrieve 4 chunks, insert them into a prompt, call the LLM, return text. Which ordering is correct?'
    options:
      - question → LLM → retriever → prompt → parser
      - question → retriever → prompt → LLM → parser
      - question → prompt → LLM → retriever → parser
      - retriever → question → LLM → prompt → parser
    answer: [B]
    explain: Retrieve context first, fill the prompt, generate, then parse.

  - id: d4-06
    objective: 'Choose the basic elements needed to create a RAG application: model flavor, embedding model, retriever, dependencies, input examples, model signature'
    q: Registering a model to Unity Catalog fails with an error about a missing signature. What is the simplest fix?
    options:
      - Set registered_model_name in log_model() to skip the check
      - Register to the workspace registry, which doesn't need a signature
      - Log with an input_example (or use ResponsesAgent, which infers it)
      - Add pip_requirements so that MLflow can infer the signature
    answer: [C]
    explain: Unity Catalog requires a model signature. MLflow infers it from input_example, and ResponsesAgent infers it automatically. pip_requirements and registered_model_name don't provide one.

  - id: d4-07
    objective: 'Choose the basic elements needed to create a RAG application: model flavor, embedding model, retriever, dependencies, input examples, model signature'
    q: Which TWO should be specified when logging a RAG agent so it deploys and runs reliably on Model Serving?
    options:
      - Dependencies (pip_requirements or code_paths)
      - The ID of the cluster it was developed on
      - Resources it uses (LLM endpoint, Vector Search index)
      - The serving endpoint's workload size
      - A personal access token stored in model_config
    answer: [A, C]
    explain: Dependencies make the serving environment reproducible. Declared resources enable automatic authentication passthrough. Never hard-code tokens.

  - id: d4-08
    objective: 'Choose the basic elements needed to create a RAG application: model flavor, embedding model, retriever, dependencies, input examples, model signature'
    q: A RAG index was built with databricks-gte-large-en. Which embedding model should the retriever use to embed incoming queries?
    options:
      - The generation LLM's own embedding layer
      - databricks-bge-large-en, which is faster
      - databricks-gte-large-en (the same model)
      - Any embedding model with 1024 dimensions
    answer: [C]
    explain: Queries must go into the same vector space as the documents, so use the same model. With managed embeddings, the index does this for you.

  - id: d4-09
    objective: Register the model to Unity Catalog using MLflow
    q: Which code registers a logged agent to Unity Catalog as support_agent in the genai schema of the main catalog?
    options:
      - set_registry_uri("databricks-uc"); register_model(uri, "main.genai.support_agent")
      - set_registry_uri("databricks"); register_model(uri, "main.genai.support_agent")
      - set_registry_uri("databricks-uc"); register_model(uri, "support_agent")
      - register_model(uri, "main.genai.support_agent", stage="Production")
    answer: [A]
    explain: 'Use the databricks-uc registry URI and a three-level name: catalog.schema.model. Stages don''t exist in UC.'

  - id: d4-10
    objective: Register the model to Unity Catalog using MLflow
    q: In Unity Catalog, how should a team mark which model version is currently in production and roll back easily?
    options:
      - Aliases such as @champion, moved between versions
      - A tag such as env=prod, updated on each release
      - A new registered model name for each release
      - Model stages (Staging → Production) on each version
    answer: [A]
    explain: UC models use aliases instead of the legacy stages. Moving an alias is an instant promotion or rollback, and the serving config can reference the alias.

  - id: d4-11
    objective: Register the model to Unity Catalog using MLflow
    q: An engineer's register_model() call into main.genai fails with a permission error. They already have USE CATALOG and USE SCHEMA. Which privilege on the schema is missing?
    options:
      - MODIFY
      - CREATE TABLE
      - EXECUTE
      - CREATE MODEL
    answer: [D]
    explain: Registering needs CREATE MODEL on the schema, plus USE CATALOG and USE SCHEMA.

  - id: d4-12
    objective: Create and query a Vector Search index
    q: Which call creates an index that automatically keeps itself in sync with a Delta table and computes embeddings from a text column?
    options:
      - create_direct_access_index(..., embedding_model_endpoint_name="databricks-gte-large-en")
      - create_delta_sync_index(..., embedding_source_column="chunk", embedding_model_endpoint_name=ep)
      - create_delta_sync_index(..., embedding_vector_column="emb", embedding_dimension=1024)
      - create_direct_access_index(..., embedding_vector_column="emb", embedding_dimension=1024)
    answer: [B]
    explain: A Delta Sync index with embedding_source_column plus a model endpoint means managed embeddings with automatic sync. embedding_vector_column means you supply the vectors yourself.

  - id: d4-13
    objective: Create and query a Vector Search index
    q: A Delta Sync index uses pipeline_type="TRIGGERED". New rows were added to the source table. How do they appear in the index?
    options:
      - After the endpoint restarts on its next schedule
      - After index.sync() is called (manually or by a job)
      - Only after the index is dropped and recreated
      - Automatically within minutes, since CDF is enabled
    answer: [B]
    explain: Triggered sync updates only when triggered. CDF records the changes, but nothing applies them until sync runs. Continuous mode updates automatically.

  - id: d4-14
    objective: Create and query a Vector Search index
    q: Which similarity_search arguments return results restricted to HR documents and combine keyword and semantic matching?
    options:
      - 'filters={"department": "HR"}, query_type="HYBRID"'
      - query_text="HR documents", query_type="FULL_TEXT"
      - 'filters={"department": "HR"}, query_type="ANN"'
      - columns=["department"], query_type="HYBRID"
    answer: [A]
    explain: Metadata filters narrow the results, and query_type="HYBRID" combines vector and BM25 keyword search. ANN is vector-only.

  - id: d4-15
    objective: Explain the key concepts and components of Mosaic AI Vector Search
    q: Which TWO statements about Direct Vector Access indexes are true?
    options:
      - They compute embeddings from a text column for you
      - You write and delete vectors via the SDK or REST API
      - They run only on storage-optimized endpoints
      - They don't sync automatically from a Delta table
      - They need Change Data Feed on a source table
    answer: [B, D]
    explain: Direct Vector Access means manual upserts and deletes with no source table sync. Delta Sync indexes need CDF.

  - id: d4-16
    objective: Explain the key concepts and components of Mosaic AI Vector Search
    q: What is the difference between managed and self-managed embeddings in a Delta Sync index?
    options:
      - 'Managed: syncs automatically. Self-managed: requires manual upserts for every change'
      - 'Managed: standard endpoints only. Self-managed: storage-optimized endpoints only'
      - 'Managed: vectors stored by Databricks. Self-managed: vectors kept in your own storage'
      - 'Managed: Databricks embeds a text column. Self-managed: the table already has vectors'
    answer: [D]
    explain: With managed embeddings Databricks calls the embedding endpoint. With self-managed embeddings you provide the vectors in the table. Both are Delta Sync indexes that sync from the table.

  - id: d4-17
    objective: Explain the key concepts and components of Mosaic AI Vector Search
    q: Which algorithm and distance does Databricks Vector Search (now AI Search) use for approximate nearest neighbour search?
    options:
      - HNSW with cosine similarity
      - HNSW with L2 distance
      - IVF-PQ with inner product
      - Exact k-NN with cosine similarity
    answer: [B]
    explain: The docs state that it uses HNSW for ANN with L2 distance.

  - id: d4-18
    objective: Configure vector search for a particular solution based on number of embeddings, update frequency, latency, and cost requirements
    q: A legal archive has 1.2 billion chunks, is updated once a week, and users accept a few hundred milliseconds of extra latency. Cost must be minimized. Which configuration fits?
    options:
      - Storage-optimized endpoint, Direct Vector Access
      - Standard endpoint, continuous Delta Sync
      - Standard endpoint, triggered Delta Sync
      - Storage-optimized endpoint, triggered Delta Sync
    answer: [D]
    explain: Over 1B vectors, cost-sensitive and latency-tolerant with weekly updates points to storage-optimized with triggered sync.

  - id: d4-19
    objective: Configure vector search for a particular solution based on number of embeddings, update frequency, latency, and cost requirements
    q: A retailer's product search serves up to 100 QPS on 50 million items, and latency is the most critical metric. The team accepts extra up-front development work to improve accuracy. Which setup is best?
    options:
      - Fine-tuned embedding model, standard endpoint, hybrid search and reranking off
      - Default embedding model, storage-optimized endpoint, hybrid and reranking on
      - Fine-tuned embedding model, storage-optimized endpoint, reranking on
      - Default embedding model, standard endpoint, hybrid and reranking on
    answer: [A]
    explain: Latency first means a standard endpoint, with no hybrid search or reranking (both add latency). Improve accuracy up front with a fine-tuned embedding model instead.

  - id: d4-20
    objective: Configure vector search for a particular solution based on number of embeddings, update frequency, latency, and cost requirements
    q: Inventory availability text changes every few seconds and must be searchable almost immediately. Which configuration is appropriate?
    options:
      - Storage-optimized endpoint, CONTINUOUS mode
      - Standard endpoint, TRIGGERED sync every hour
      - Standard endpoint, Delta Sync in CONTINUOUS mode
      - Storage-optimized endpoint, TRIGGERED every 5 min
    answer: [C]
    explain: Continuous sync gives near real-time freshness, and it's only available on standard endpoints. It costs more than triggered sync.

  - id: d4-21
    objective: Identify how to serve an LLM application that leverages Foundation Model APIs
    q: A team is prototyping and expects low, unpredictable traffic. Which Foundation Model API mode is most appropriate?
    options:
      - Pay-per-token
      - A custom GPU model serving endpoint
      - Batch inference with ai_query()
      - Provisioned throughput
    answer: [A]
    explain: Pay-per-token needs no capacity planning and is ideal for development and variable or low traffic.

  - id: d4-22
    objective: Identify how to serve an LLM application that leverages Foundation Model APIs
    q: A production app needs guaranteed throughput and performance for a fine-tuned Llama model. Which option fits?
    options:
      - An external model endpoint
      - Provisioned throughput
      - Pay-per-token
      - Batch inference with ai_query()
    answer: [B]
    explain: Provisioned throughput gives dedicated capacity and supports fine-tuned or custom-weight foundation models.

  - id: d4-23
    objective: Identify how to serve an LLM application that leverages Foundation Model APIs
    q: The company wants a third-party provider's model (e.g. a hosted proprietary LLM) governed through Databricks with centralized credentials, rate limits and logging. What should they create?
    options:
      - A provisioned throughput endpoint for the provider's model
      - An external model endpoint, with the key in Databricks secrets
      - A custom pyfunc endpoint that calls the provider with the key in code
      - A Databricks App that proxies calls, with the key in its config file
    answer: [B]
    explain: External model endpoints proxy third-party providers, so AI Gateway features and secrets management apply to them too.

  - id: d4-24
    objective: Identify batch inference workloads and apply ai_query() appropriately
    q: Which workload is the best fit for ai_query()?
    options:
      - Interactive prompt testing in the AI Playground
      - An agent tool called during each live user request
      - A customer chat UI that streams answers token by token
      - Nightly sentiment scoring of 5M reviews in a Delta table
    answer: [D]
    explain: ai_query is built for batch inference over tables in SQL or jobs, not for interactive or per-request use.

  - id: d4-25
    objective: Identify batch inference workloads and apply ai_query() appropriately
    q: A batch ai_query job over 10M rows fails entirely when a few rows hit model errors. What should be changed?
    options:
      - failOnError => false, so errors come back per row
      - Lower max_tokens so fewer rows hit model errors
      - Switch to a provisioned throughput endpoint
      - Retry the whole job until it completes without errors
    answer: [A]
    explain: With failOnError => false, ai_query returns a result and an error per row, so the job can finish and failed rows can be retried.

  - id: d4-26
    objective: Identify batch inference workloads and apply ai_query() appropriately
    q: An ai_query batch job must return extracted fields as a typed structure instead of free text. Which argument helps?
    options:
      - failOnError
      - endpoint
      - responseFormat
      - modelParameters
    answer: [C]
    explain: responseFormat makes the model return output that matches a JSON schema or STRUCT. modelParameters sets options such as temperature.

  - id: d4-27
    objective: Configure a persistent datastore to store and retrieve intermediate memory or structured information
    q: A multi-turn agent must persist conversation state (thread checkpoints) with low-latency reads and writes on every turn. Which datastore is most appropriate on Databricks?
    options:
      - An online feature table keyed on thread_id
      - Lakebase, as a LangGraph checkpointer
      - A Delta table with one row appended per message
      - The MLflow trace store, read back on each turn
    answer: [B]
    explain: Lakebase is an OLTP database built for frequent small transactional reads and writes. Delta is built for analytics, and traces aren't a state store.

  - id: d4-28
    objective: Configure a persistent datastore to store and retrieve intermediate memory or structured information
    q: An agent needs low-latency lookups of per-customer structured attributes (tier, region, open orders) during each request. Which TWO options fit?
    options:
      - An online feature table keyed on customer_id
      - A Vector Search index over customer profiles
      - The attributes of all customers in the system prompt
      - A Lakebase table queried by a tool
      - A monthly fine-tune of the LLM on customer attributes
    answer: [A, D]
    explain: Online feature tables and Lakebase give fast key-based lookups of structured data.

  - id: d4-29
    objective: Apply CI/CD best practices such as updating a Vector Search index, promoting prompts across environments, and testing individual components of an agent
    q: A nightly ingestion job MERGEs updated chunks into the source table of a triggered Delta Sync index. What should the CI/CD workflow do next?
    options:
      - Switch the index to CONTINUOUS for that run
      - Redeploy the agent so it loads the new chunks
      - A step that calls index.sync() after the MERGE
      - Nothing; CDF pushes changes to triggered indexes
    answer: [C]
    explain: Triggered indexes need an explicit sync after the source table changes.

  - id: d4-30
    objective: Apply CI/CD best practices such as updating a Vector Search index, promoting prompts across environments, and testing individual components of an agent
    q: Which TWO are good practices for testing an agent in CI?
    options:
      - Evaluate on a fresh set of LLM-generated questions in every CI run
      - Unit-test tools, the retriever and output parsers separately
      - Review prompt changes manually instead of testing them
      - Gate promotion on mlflow.genai.evaluate() with a fixed dataset
      - Promote once the endpoint deploys without errors
    answer: [B, D]
    explain: Component tests catch bugs early, and evaluation against a fixed dataset catches quality regressions.

  - id: d4-31
    objective: Apply CI/CD best practices such as updating a Vector Search index, promoting prompts across environments, and testing individual components of an agent
    q: Which tool defines Databricks resources (jobs, serving endpoints, apps) as code with dev/staging/prod targets?
    options:
      - Databricks Git folders
      - Job definitions exported as JSON from the UI
      - A driver notebook chaining dbutils.notebook.run()
      - Databricks Asset Bundles (databricks.yml)
    answer: [D]
    explain: Bundles (now also called Declarative Automation Bundles) define resources declaratively per target environment in databricks.yml and are deployed with the Databricks CLI.

  - id: d4-32
    objective: Apply prompt version control and manage prompt lifecycle
    q: A prompt is updated in dev, validated in staging, and promoted to production after approval. Version history and rollback are required. What is the recommended approach?
    options:
      - A Delta table of prompts with an is_production flag
      - Prompt Registry versions, promoted by moving aliases
      - Prompt text in Git, deployed with the agent on merge
      - Prompt Registry, editing the approved version in place
    answer: [B]
    explain: Prompt Registry versions are immutable with full history, and aliases give gated promotion and instant rollback.

  - id: d4-33
    objective: Apply prompt version control and manage prompt lifecycle
    q: How does an agent load the current production version of a prompt from the MLflow Prompt Registry?
    options:
      - mlflow.pyfunc.load_model("prompts:/main.prompts.support@production")
      - mlflow.genai.load_prompt("prompts:/main.prompts.support@production")
      - mlflow.genai.load_prompt("prompts:/main.prompts.support/production")
      - mlflow.genai.load_prompt("models:/main.prompts.support@production")
    answer: [B]
    explain: Load by alias with mlflow.genai.load_prompt and the prompts:/<name>@<alias> URI. Moving the alias changes the prompt without code changes.

  - id: d4-34
    objective: Apply prompt version control and manage prompt lifecycle
    q: A reviewer wants to fix a typo in version 3 of a prompt that production loads through the @production alias. How is this done in the MLflow Prompt Registry?
    options:
      - They register version 4 and move @production to it
      - They edit version 3 in place; @production picks it up
      - They edit version 3, then re-tag it as @production
      - They delete version 3 and re-register it as version 3
    answer: [A]
    explain: Versions are immutable, so a change creates a new version. Aliases are mutable pointers, so moving @production to version 4 promotes it, and moving it back rolls back.

  - id: d4-35
    objective: Integrate managed, external, and custom MCP servers based on a given application requirements
    q: An agent needs to call governed Unity Catalog functions and query a Vector Search index through MCP with the least maintenance. What should the engineer use?
    options:
      - An external MCP server via a UC connection
      - A custom MCP server on Databricks Apps
      - Databricks managed MCP servers
      - A LangChain toolkit wrapping the REST APIs
    answer: [C]
    explain: Managed MCP servers expose UC functions, Vector Search indexes and Genie spaces with no server to maintain.

  - id: d4-36
    objective: Integrate managed, external, and custom MCP servers based on a given application requirements
    q: A vendor provides an MCP server for its SaaS product that requires an API key. How should it be integrated with Databricks?
    options:
      - Direct REST calls from the agent, with the key in the system prompt
      - An external MCP server via a UC connection, key in secrets
      - A custom MCP server on Databricks Apps that wraps the vendor's REST API
      - A managed MCP server, with the API key passed as a tool parameter
    answer: [B]
    explain: External MCP servers connect through UC connections with secrets or managed OAuth, which keeps credentials governed and out of code. There's no need to rebuild the vendor's server.

  - id: d4-37
    objective: Integrate managed, external, and custom MCP servers based on a given application requirements
    q: The company has a proprietary internal pricing engine with a REST API and no existing MCP server. The agent must call it through MCP. What is the recommended approach?
    options:
      - The managed Vector Search MCP server
      - An external MCP server registered via a UC connection
      - A custom MCP server hosted on Databricks Apps
      - The managed Genie MCP server over pricing tables
    answer: [C]
    explain: Custom logic with no managed or external server available calls for a custom MCP server, which Databricks Apps can host.

  - id: d4-38
    objective: Develop an appropriate interactive user facing interface for an agent usage scenario (Apps, Slack, Teams, etc.)
    q: Support staff need a web chat UI for an agent endpoint. Requirements are corporate SSO, no long-lived tokens in the browser, and answers that respect each user's data permissions. Which approach is correct?
    options:
      - A Slack bot with one shared service token for all users
      - A Databricks App calling the endpoint with on-behalf-of-user auth
      - A static site calling the endpoint with each user's PAT
      - A Databricks App calling the endpoint with its service principal
    answer: [B]
    explain: Databricks Apps provide SSO and server-side calls, and user authorization (x-forwarded-access-token) enforces per-user permissions. A service principal would give everyone the same access.

  - id: d4-39
    objective: Develop an appropriate interactive user facing interface for an agent usage scenario (Apps, Slack, Teams, etc.)
    q: Domain experts must test a new agent before launch and leave structured feedback on responses. Which interface is most appropriate?
    options:
      - The AI Playground with the endpoint selected
      - The Review App from agents.deploy()
      - A Databricks App built for the launch
      - The MLflow experiment's trace UI
    answer: [B]
    explain: The Review App is designed for stakeholders and SMEs to chat with the agent and give feedback, which is logged with the traces.

  - id: d4-40
    objective: Control access to resources from model serving endpoints
    q: An agent on Model Serving queries a Vector Search index and an LLM endpoint. The team wants Databricks to manage short-lived credentials automatically. What should they do?
    options:
      - Enable on-behalf-of-user auth for both resources
      - Store a service principal's PAT in secrets as an env var
      - Declare them in resources=[...] when logging the agent
      - Grant the endpoint's creator CAN QUERY on both resources
    answer: [C]
    explain: Automatic authentication passthrough uses the declared resources to issue least-privilege, short-lived credentials.

  - id: d4-41
    objective: Control access to resources from model serving endpoints
    q: Users must only see results from tables they are personally allowed to read, enforced by Unity Catalog row filters. Which authentication method should the agent use?
    options:
      - OBO auth, with the user client created in predict()
      - Automatic passthrough, with the tables declared as resources
      - Manual auth with a service principal's OAuth secret
      - OBO auth, with the user client created in load_context()
    answer: [A]
    explain: OBO runs queries as the end user, so their UC permissions, row filters and column masks apply. The user client must be created inside predict(), because the user's identity is only known per request.

  - id: d4-42
    objective: Control access to resources from model serving endpoints
    q: An agent must call an external SaaS API that is not a Databricks resource. How should credentials be provided to the serving endpoint?
    options:
      - Declare the API as a DatabricksServingEndpoint resource
      - Put the key in model_config when logging the agent
      - Have the client app send the key in each request
      - 'Secret-backed env vars: {{secrets/scope/key}}'
    answer: [D]
    explain: Manual authentication uses secret-backed environment variables, so keys stay out of code and logs.

  - id: d4-43
    objective: Control access to resources from model serving endpoints
    q: Which endpoint permission lets a user send queries to a serving endpoint without being able to modify it?
    options:
      - CAN USE
      - CAN QUERY
      - CAN VIEW
      - CAN MANAGE
    answer: [B]
    explain: CAN QUERY allows invoking the endpoint. CAN VIEW only shows it, and CAN MANAGE allows configuration changes.

  - id: d4-44
    objective: Develop an appropriate interactive user facing interface for an agent usage scenario (Apps, Slack, Teams, etc.)
    q: Field technicians spend their whole day in Microsoft Teams and want to ask a repair-procedures agent questions without switching tools. Which interface fits best?
    options:
      - A Databricks App that they open in a browser tab
      - A Teams bot that calls the agent's serving endpoint
      - The Review App created by agents.deploy()
      - The AI Playground with the agent endpoint selected
    answer: [B]
    explain: 'Meet users where they work: a Teams integration that calls the endpoint. A Databricks App suits a custom web UI, and the Review App and Playground are for testing and feedback, not daily use.'

  - id: d4-45
    objective: Configure a persistent datastore to store and retrieve intermediate memory or structured information
    q: An agent must remember each user's preferred language and region across all future sessions and threads. Which store fits?
    options:
      - The MLflow trace from the user's previous session, loaded each time
      - A long-term memory store on Lakebase, keyed by user id
      - The LangGraph checkpointer for the user's current conversation thread
      - A Vector Search index of every past conversation, searched each turn
    answer: [B]
    explain: Cross-session facts belong in a long-term store keyed by the user. A checkpointer persists one thread, traces are for observability, and searching every past conversation is imprecise.

  - id: d4-46
    objective: Code a simple chain according to requirements
    q: An LCEL chain must return a Python dict with the keys answer and sources, parsed from the model's JSON reply. Which chain is correct?
    options:
      - prompt | llm | JsonOutputParser()
      - prompt | llm | StrOutputParser()
      - prompt | JsonOutputParser() | llm
      - llm | prompt | JsonOutputParser()
    answer: [A]
    explain: The parser goes last and must parse JSON into a dict. StrOutputParser returns a string.
