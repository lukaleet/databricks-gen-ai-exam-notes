section: d6
questions:
  - id: d6-01
    objective: Select an LLM choice (size and architecture) based on a set of quantitative evaluation metrics
    q: Evaluation results - Model P (70B dense) correctness 0.90, cost $$$, p95 3.5s; Model Q (8B) correctness 0.88, cost $, p95 0.6s; Model R (3B) correctness 0.71, cost ¢, p95 0.3s. Requirement - correctness ≥ 0.85 at minimal cost. Which model?
    options:
      - P for hard questions, R for easy ones
      - P
      - R
      - Q
    answer: [D]
    explain: Q meets the threshold at the lowest cost. P's small quality gain isn't worth the cost, and R fails the threshold.

  - id: d6-02
    objective: Select an LLM choice (size and architecture) based on a set of quantitative evaluation metrics
    q: 'Two candidate models have similar quality: a Mixture-of-Experts model with 47B total parameters that activates about 13B per token, and a 47B dense model. Why is the MoE model usually cheaper to serve per token?'
    options:
      - Only a few experts run per token, so compute per token is lower
      - It stores fewer parameters, so it needs much less GPU memory
      - It has a longer context window, so fewer calls are needed
      - It skips the attention layers for most of the tokens
    answer: [A]
    explain: MoE routes each token to a few experts, so it has large capacity with lower compute per token. All experts still have to be in memory, so it doesn't save memory.

  - id: d6-03
    objective: Select key metrics to monitor for a specific LLM deployment scenario
    q: Which TWO metrics are most important to monitor for a customer-facing real-time chatbot?
    options:
      - Latency (p95, time to first token) and error rate
      - Daily token totals of the nightly batch summarization jobs
      - BLEU against reference answers
      - Training loss of the base model
      - Safety/quality judge scores and user feedback
    answer: [A, E]
    explain: Real-time UX depends on latency and errors. Quality and safety signals catch harmful or poor answers.

  - id: d6-04
    objective: Select key metrics to monitor for a specific LLM deployment scenario
    q: A nightly batch summarization job processes 10M documents. Which metrics matter most?
    options:
      - Request queue depth, cold starts, per-user QPM
      - Time-to-first-token, p95 latency, concurrent users
      - Thumbs-up rate, session length, user retention
      - Throughput, cost, errors, sampled quality
    answer: [D]
    explain: Batch workloads care about throughput, cost, failures and overall quality, not interactive latency or user engagement.

  - id: d6-05
    objective: Evaluate agent performance using MLflow scoring and tracing
    q: In mlflow.genai.evaluate(data=..., predict_fn=..., scorers=[...]), how are the "inputs" of each evaluation row passed to predict_fn?
    options:
      - As a JSON string in a request argument
      - As one dict passed as a positional argument
      - As keyword arguments named after the inputs keys
      - As a pandas Series holding the whole row
    answer: [C]
    explain: Each row's inputs dict is unpacked into keyword arguments of predict_fn.

  - id: d6-06
    objective: Evaluate agent performance using MLflow scoring and tracing
    q: The team already has production traces and wants to score them without re-running the agent. How?
    options:
      - Replay each trace's inputs through predict_fn to rebuild the outputs
      - Copy the traces into a judge prompt and call the judge LLM directly
      - Pass the traces to evaluate() with no predict_fn
      - Register the scorers for monitoring with sample_rate=1.0
    answer: [C]
    explain: mlflow.genai.evaluate can score existing traces directly, so predict_fn isn't needed. Registered monitoring scorers only score new traffic.

  - id: d6-07
    objective: Evaluate agent performance using MLflow scoring and tracing
    q: A user reports a wrong answer. The engineer opens the MLflow trace for that request. What can they see?
    options:
      - Only the final prompt and answer, plus the total latency
      - The user's chat history across all of their sessions
      - The model weights and the serving container's logs
      - Every step's inputs, outputs and latency
    answer: [D]
    explain: Traces capture every step as spans, which lets you debug and evaluate each one.

  - id: d6-08
    objective: Use inference logging to assess deployed RAG application performance
    q: An engineer wants to find which production questions received poorly grounded answers last week. What is the best data source?
    options:
      - The usage table, filtered to the longest responses
      - Inference table, scored by a groundedness judge
      - The evaluation results from the pre-launch test dataset
      - Review App feedback from the SME pilot
    answer: [B]
    explain: Inference tables and traces log real requests and responses. Scoring them with judges finds the failing cases. Pre-launch results don't cover last week's traffic.

  - id: d6-09
    objective: Use inference logging to assess deployed RAG application performance
    q: An analyst wants to query last week's request and response payloads for an agent endpoint with SQL and govern access to them. Where are they stored?
    options:
      - In a Unity Catalog Delta table (the inference table)
      - As JSON artifacts in the MLflow experiment
      - In the endpoint's container logs in the Serving UI
      - In the system.serving.endpoint_usage system table
    answer: [A]
    explain: Inference tables are UC Delta tables, so you can query them with SQL and govern them like any other table. endpoint_usage holds token counts, not payloads.

  - id: d6-10
    objective: Use Databricks features to control LLM costs
    q: Which TWO actions reduce LLM serving costs on Databricks?
    options:
      - The largest model, so that fewer retries are needed
      - The smallest model that meets the bar, with fewer prompt tokens
      - A real-time endpoint instead of ai_query for 10M-row jobs
      - AI Gateway rate limits per user, group or endpoint
      - Expensive monitoring judges at 100% sampling
    answer: [B, D]
    explain: Rate limits cap spending, and right-sizing models and prompts lowers the cost per request.

  - id: d6-11
    objective: Use Databricks features to control LLM costs
    q: A custom agent endpoint is used only during business hours in development. How can idle cost be minimized?
    options:
      - Scale-to-zero on the serving endpoint
      - A rate limit of 10 queries per minute
      - A smaller workload size, scale-to-zero off
      - Disabling inference tables and tracing
    answer: [A]
    explain: Scale-to-zero removes idle compute cost. The trade-off is a cold start.

  - id: d6-12
    objective: Use Databricks features to control LLM costs
    q: Which system table tracks per-request token usage for serving endpoints governed by AI Gateway?
    options:
      - system.serving.endpoint_usage
      - system.access.audit
      - system.billing.usage
      - system.serving.served_entities
    answer: [A]
    explain: system.serving.endpoint_usage records token counts and requesters per request, and joins with system.serving.served_entities. billing.usage is aggregated by SKU, not per request.

  - id: d6-13
    objective: Use inference tables and Agent Monitoring to track a live LLM endpoint
    q: How are LLM judges set up to continuously evaluate a sample of live agent traffic in MLflow 3?
    options:
      - Safety().register(...).start(sampling_config=ScorerSamplingConfig(sample_rate=0.2))
      - agents.deploy(model, version, scorers=[Safety()], sample_rate=0.2)
      - mlflow.genai.evaluate(data=eval_set, scorers=[Safety()]) run once before each release
      - Safety().start(sample_rate=0.2) on an unregistered scorer
    answer: [A]
    explain: Production monitoring uses .register() then .start() with a sample rate. Results are attached to traces as feedback. A one-off evaluate() isn't continuous.

  - id: d6-14
    objective: Use inference tables and Agent Monitoring to track a live LLM endpoint
    q: Which kinds of scorers can be used for MLflow production monitoring? Select TWO.
    options:
      - Class-based Scorer subclasses with custom __init__ logic
      - Correctness on unlabeled live traffic
      - Built-in judges such as Safety and RelevanceToQuery
      - Spark ML evaluators
      - '@scorer functions registered from a Databricks notebook'
    answer: [C, E]
    explain: Production monitoring supports built-in judges and @scorer functions. Class-based Scorers aren't supported, and live traffic has no ground truth.

  - id: d6-15
    objective: Identify evaluation judges that require ground truth
    q: Which TWO built-in judges require ground truth (expectations)?
    options:
      - RetrievalSufficiency
      - RetrievalGroundedness
      - Safety
      - Correctness
      - RelevanceToQuery
    answer: [A, D]
    explain: Correctness and RetrievalSufficiency compare against expected facts or responses. ToolCallCorrectness also needs expectations.

  - id: d6-16
    objective: Identify evaluation judges that require ground truth
    q: Which judge can detect hallucinations relative to retrieved documents WITHOUT any ground truth?
    options:
      - ToolCallCorrectness
      - Correctness
      - RetrievalSufficiency
      - RetrievalGroundedness
    answer: [D]
    explain: RetrievalGroundedness checks whether the response is supported by the retrieved context. No reference answer is needed.

  - id: d6-17
    objective: Use AI Gateway (Inference Tables, Usage Tables, and rate limiting) to track an LLM or agent deployed via Agent Framework
    q: 'An agent deployed with Agent Framework must have: request/response logs for debugging, per-user token usage reports, and a cap of 100 queries per minute per user. Which AI Gateway features map to these needs (in order)?'
    options:
      - Rate limits; guardrails; inference tables
      - Usage tracking; fallbacks; guardrails
      - Guardrails; inference tables; traffic splitting
      - Inference tables; usage tracking; rate limits
    answer: [D]
    explain: Inference tables give payload logs, usage tracking gives token usage (system.serving.endpoint_usage), and rate limits give QPM/TPM caps.

  - id: d6-18
    objective: Use AI Gateway (Inference Tables, Usage Tables, and rate limiting) to track an LLM or agent deployed via Agent Framework
    q: The team wants to send 10% of traffic to a new model version and fail over to a backup model when the primary errors. Which AI Gateway features apply?
    options:
      - Traffic splitting and rate limits
      - Fallbacks and guardrails
      - Traffic splitting and fallbacks
      - Prompt Registry aliases and rate limits
    answer: [C]
    explain: Traffic splitting routes a percentage of requests, and fallbacks redirect to another model on errors.

  - id: d6-19
    objective: Use Databricks custom Scorers for evaluating agents and LLMs
    q: Every response must include a citation in the format "[source:<doc_id>]". What is the simplest, cheapest way to evaluate this?
    options:
      - A code-based @scorer with a regex check
      - A Guidelines judge stating the citation rule
      - RetrievalGroundedness on every response
      - A make_judge() judge with a citation rubric
    answer: [A]
    explain: Deterministic format checks fit code-based scorers. They're fast, cheap and exact, while LLM judges cost more and can be wrong.

  - id: d6-20
    objective: Use Databricks custom Scorers for evaluating agents and LLMs
    q: The team needs to evaluate whether responses "acknowledge the customer's frustration empathetically" - a subjective, natural-language criterion. Which TWO approaches fit?
    options:
      - RelevanceToQuery on each response
      - A Guidelines judge with the criterion in natural language
      - A regex scorer that counts words such as "sorry" and "apologize"
      - ROUGE against reference replies
      - A custom judge from make_judge() over inputs and outputs
    answer: [B, E]
    explain: Subjective criteria need LLM judges, either Guidelines or a custom make_judge judge.

  - id: d6-21
    objective: Use Databricks custom Scorers for evaluating agents and LLMs
    q: Which parameters can a function decorated with @scorer accept?
    options:
      - request, response, retrieved_context, trace
      - inputs, outputs, ground_truth, spans
      - inputs, outputs, expectations, trace
      - prompt, completion, references, metadata
    answer: [C]
    explain: Custom scorers can use inputs, outputs, expectations and the full trace, and return values or Feedback objects. request/response is the legacy Agent Evaluation naming.

  - id: d6-22
    objective: Incorporate SME feedback to improve agent performance
    q: Four SMEs rate the same responses very differently, making evaluation data unreliable. What should the engineer do?
    options:
      - Write rubrics and calibrate the SMEs
      - Average the four ratings and use them as ground truth
      - Keep only the items where all four SMEs agree
      - Replace the SME ratings with an LLM judge's scores
    answer: [A]
    explain: Rater inconsistency is fixed at the root with rubrics and calibration. Averaging or filtering hides the problem.

  - id: d6-23
    objective: Incorporate SME feedback to improve agent performance
    q: How can SME corrections collected in the Review App be used to improve the agent systematically?
    options:
      - Make them eval expectations; re-evaluate
      - Use the corrections as monitoring scorer thresholds
      - Add all corrections to the system prompt as examples
      - Fine-tune the LLM on the corrections every week
    answer: [A]
    explain: SME labels become expectations in evaluation datasets, which drives measurable, regression-tested improvement.

  - id: d6-24
    objective: Incorporate SME feedback to improve agent performance
    q: An LLM judge often disagrees with domain experts. How can the judge be made more trustworthy at scale?
    options:
      - Average the judge's score with one SME's score
      - Lower the judge's temperature to 0 for consistency
      - Align it with SME labels; check agreement
      - Switch to the largest judge model available
    answer: [C]
    explain: Judge alignment uses SME labels to tune the judge so it reproduces expert judgments. Check agreement before relying on it.

  - id: d6-25
    objective: Use inference logging to assess deployed RAG application performance
    q: After launch, users complain that answers about a new product line are poor. How should the engineer confirm the cause using logged production data?
    options:
      - Look at the endpoint's CPU and memory metrics during the complaint period
      - Re-run the pre-launch evaluation dataset and compare the scores with last month's
      - Filter logged requests to those questions and inspect the retrieved chunks
      - Check the usage table for token spikes on the days the complaints came in
    answer: [C]
    explain: Logged requests show what was actually retrieved for the failing questions, for example no chunks about the new line, which points to a missing source. The pre-launch dataset doesn't contain these questions.

  - id: d6-26
    objective: Select an LLM choice (size and architecture) based on a set of quantitative evaluation metrics
    q: For a high-volume ticket classifier, a fine-tuned 7B model scores F1 0.93 at p95 120 ms, and a 70B general model with few-shot prompts scores F1 0.94 at p95 1.8 s. The requirement is F1 ≥ 0.90 with p95 under 500 ms. Which model?
    options:
      - The fine-tuned 7B model
      - Neither; train a 1B model first
      - The 70B general model
      - The 70B model with a lower max_tokens
    answer: [A]
    explain: Only the 7B model meets the latency requirement, and it clears the quality bar. Lowering max_tokens doesn't make a 70B model 3x faster for this case.

  - id: d6-27
    objective: Select key metrics to monitor for a specific LLM deployment scenario
    q: An agent that books meetings through calendar tools is live. Which metric best shows whether it is doing its job?
    options:
      - Task success rate from traces
      - ROUGE against reference replies
      - Average response length in tokens
      - Number of tool definitions loaded
    answer: [A]
    explain: For an action-taking agent, the key outcome metric is whether the task completed correctly, measured from traces, tool results or feedback. Length and n-gram overlap don't measure that.
